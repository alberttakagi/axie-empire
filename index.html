<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Axie Empire</title>
    <!-- Rowdies: Axie Infinity's own real UI font (bible §A.10.8's "bold
         rounded typography... reads as playful" note, now the literal
         actual typeface rather than an approximation) — a free Google Font,
         so no asset hosting/licensing of our own to manage. Phaser's own
         Text objects (see GameScene.js etc.) reference it by family name;
         loading it here via a real stylesheet link (not just @font-face)
         is what makes it available to the browser's canvas text renderer
         those Text objects draw through. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rowdies:wght@300;400;700&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #111;
        overscroll-behavior: none;
        touch-action: none;
      }
      #app {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
      }
      canvas {
        max-width: 100vw;
        max-height: 100vh;
      }

      #rotate-prompt {
        display: none;
      }

      /* This is a landscape-only game (800x450) with no per-screen mobile
         layout of its own — FIT scale mode still renders it in portrait,
         just letterboxed down to a thin strip, unplayably small. Shown
         only on an actual touch-primary device in portrait (hover: none +
         pointer: coarse), not a desktop window a user has simply resized
         narrow-and-tall, which they can just resize back. */
      @media (orientation: portrait) and (hover: none) and (pointer: coarse) {
        #app {
          display: none;
        }
        #rotate-prompt {
          display: flex;
          position: fixed;
          inset: 0;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          background: #111;
          color: #fff;
          font-family: Rowdies, sans-serif;
          text-align: center;
          padding: 24px;
          box-sizing: border-box;
        }
        #rotate-prompt svg {
          width: 64px;
          height: 64px;
          animation: rotate-hint 1.6s ease-in-out infinite;
        }
        @keyframes rotate-hint {
          0%, 100% { transform: rotate(0deg); }
          50% { transform: rotate(-90deg); }
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="rotate-prompt">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="2" width="14" height="20" rx="2" />
        <path d="M12 18h.01" />
      </svg>
      <div>Rotate your device to landscape to play Axie Empire.</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

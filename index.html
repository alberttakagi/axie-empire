<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Axie Empire</title>
    <!-- Rowdies: Axie Infinity's own real UI font (bible §A.10.8's "bold
         rounded typography... reads as playful" note, now the literal
         actual typeface rather than an approximation) — a free Google Font,
         so no asset hosting/licensing of our own to manage. Phaser's own
         Text objects (see GameScene.js etc.) reference it by family name;
         loading it here via a real stylesheet link (not just @font-face)
         is what makes it available to the browser's canvas text renderer
         those Text objects draw through. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rowdies:wght@300;400;700&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #111;
        overscroll-behavior: none;
        touch-action: none;
      }
      #app {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
      }
      canvas {
        max-width: 100vw;
        max-height: 100vh;
      }

      /* This is a landscape-only game (800x450) with no per-screen mobile
         layout of its own. A real "please rotate" prompt used to block
         portrait phones outright — a dead end for anyone who can't
         physically rotate (e.g. a link opened inside X's in-app browser,
         which stays portrait-locked regardless of the physical device
         orientation, so the game was simply unreachable from an X share
         link). Dropping that gate entirely fixed the dead end, but left
         portrait phones — the common case for a share-link tap — stuck
         with Phaser's own Scale.FIT rendering a small, width-constrained
         canvas (per the game's real 800x450 aspect vs. a much taller
         phone screen), not the big view the user wants.
         So: rotate #app itself 90° to fake landscape, filling the portrait
         screen at full size — the player doesn't need to touch anything,
         and once they DO physically turn the phone (a natural reaction to
         sideways content — this is a common, recognized mobile-web-game
         pattern), the `orientation: portrait` media query below stops
         matching on any browser that reports rotation correctly, so this
         rule turns itself off and the game reverts to plain, upright,
         full-size FIT — no double-rotation, no JS needed either way.
         Real bug, found live and worth keeping in mind if this ever needs
         touching again: Phaser's own Scale.FIT sizing measures its parent
         with getBoundingClientRect() (confirmed in Phaser's own
         ScaleManager source), which — unlike clientWidth/clientHeight —
         always reports the POST-transform box, so it sees #app's rotated
         (portrait-shaped) rect no matter how the PRE-rotation width/height
         are set, and fits its 800x450 canvas inside THAT — a thumbnail
         floating in a corner, not filling the rotated frame. There's no
         DOM-nesting trick around this (an ancestor's transform always
         reaches every descendant's measured rect), so this doesn't rely on
         Phaser's own measurement here: canvas width/height is forced to
         fill #app's local (pre-rotation, already-landscape) box outright,
         with object-fit preserving the game's real aspect ratio inside it
         exactly like FIT would have. */
      @media (orientation: portrait) and (hover: none) and (pointer: coarse) {
        #app {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vh;
          height: 100vw;
          transform-origin: top left;
          transform: rotate(90deg) translateY(-100%);
        }
        canvas {
          width: 100% !important;
          height: 100% !important;
          max-width: none !important;
          max-height: none !important;
          object-fit: contain;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
